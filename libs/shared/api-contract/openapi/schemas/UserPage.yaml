type: object
required: [items, total, page, pageSize]
properties:
  items:
    type: array
    items:
      $ref: './AdminUser.yaml'
  total:
    type: integer
    minimum: 0
    description: Number of users matching the filter across all pages.
  page:
    type: integer
    minimum: 1
  pageSize:
    type: integer
    minimum: 1
    maximum: 100
