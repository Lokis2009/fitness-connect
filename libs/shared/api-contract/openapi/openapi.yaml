openapi: 3.1.0
info:
  title: Fitness Connect API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Source of truth for the HTTP API. Keep this file thin: add paths under
    paths/ and schemas under schemas/ and reference them here.
servers:
  - url: http://localhost:3000/v1
tags:
  - name: system
    description: Liveness and service information.
  - name: identity
    description: The signed-in user and roles.
  - name: trainer
    description: Trainer home, the lists a signed-in trainer works from.
  - name: booking
    description: Answering booking requests.
  - name: admin
    description: Admin-only reads such as the list of users.
  - name: dev
    description: Development only. Not available in production.
security:
  - bearerAuth: []
paths:
  /health:
    $ref: './paths/health.yaml'
  /me:
    $ref: './paths/me.yaml'
  /trainers/me/booking-requests:
    $ref: './paths/trainer-booking-requests.yaml'
  /trainers/me/sessions:
    $ref: './paths/trainer-sessions.yaml'
  /bookings/{id}/accept:
    $ref: './paths/booking-accept.yaml'
  /bookings/{id}/decline:
    $ref: './paths/booking-decline.yaml'
  /admin/users:
    $ref: './paths/admin-users.yaml'
  /dev/login:
    $ref: './paths/dev-login.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Role:
      $ref: './schemas/Role.yaml'
    User:
      $ref: './schemas/User.yaml'
    HealthStatus:
      $ref: './schemas/HealthStatus.yaml'
    DevLoginRequest:
      $ref: './schemas/DevLoginRequest.yaml'
    DevLoginResponse:
      $ref: './schemas/DevLoginResponse.yaml'
    Problem:
      $ref: './schemas/Problem.yaml'
    TrainerStatus:
      $ref: './schemas/TrainerStatus.yaml'
    BookingStatus:
      $ref: './schemas/BookingStatus.yaml'
    VenueSummary:
      $ref: './schemas/VenueSummary.yaml'
    BookingRequest:
      $ref: './schemas/BookingRequest.yaml'
    BookingRequestList:
      $ref: './schemas/BookingRequestList.yaml'
    Session:
      $ref: './schemas/Session.yaml'
    SessionList:
      $ref: './schemas/SessionList.yaml'
    Booking:
      $ref: './schemas/Booking.yaml'
    AdminUser:
      $ref: './schemas/AdminUser.yaml'
    UserPage:
      $ref: './schemas/UserPage.yaml'
