post:
  tags: [dev]
  operationId: devLogin
  summary: Issue a development token for a seeded user
  description: Exists only when the API does not run in production mode.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/DevLoginRequest.yaml'
  responses:
    '200':
      description: Token for the user
      content:
        application/json:
          schema:
            $ref: '../schemas/DevLoginResponse.yaml'
    '400':
      $ref: '../responses/BadRequest.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
    '500':
      $ref: '../responses/InternalError.yaml'
