get:
  tags: [identity]
  operationId: getMe
  summary: The signed-in user
  responses:
    '200':
      description: Current user
      content:
        application/json:
          schema:
            $ref: '../schemas/User.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '403':
      $ref: '../responses/Forbidden.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
    '500':
      $ref: '../responses/InternalError.yaml'
