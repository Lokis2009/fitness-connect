# Source of truth for the workstreams table in STATUS.md.
# Edit this file in the same PR that changes a workstream, then run `pnpm status:generate`.
#
# Required: id, name, state, summary. Optional: owner, next, blockedBy, links.
# state:      done | in-progress | planned | blocked | deferred
# owner:      person or team responsible
# next:       the next concrete step (also shown on blocked items)
# blockedBy:  required when state is blocked
# links:      repo-relative paths (an #anchor is allowed); checked to exist
# Keep summaries to one sentence. Detail belongs in the linked plan, PRD or decision log.

focus: Deliver the first release, scheduled in-person sessions with trainer approval and in-person payment.

workstreams:
  - id: phase-1-foundation
    name: Phase 1 foundation
    state: done
    summary: Nx workspace, three Angular apps, NestJS API, Postgres with PostGIS, OpenAPI contract and a login page per app against the real API (development auth).
    links:
      - docs/plans/phase-1-repo-foundation.md

  - id: design-tokens
    name: Design tokens and type scale
    state: done
    summary: Shared UI library uses one set of design tokens, Material is mapped to them, and Inter and Space Grotesk are loaded.
    links:
      - .claude/rules/design-system.md
      - libs/frontend/ui/src/styles/tokens.css

  - id: home-pages
    name: Client and admin home pages
    state: in-progress
    summary: Backlog for a minimal client home and an admin home that lists users and trainers by role.
    next: Rebase the shared UI components (HP-2) onto main, and build the admin users contract and API (HP-1, HP-3) in parallel.
    links:
      - docs/backlog/home-pages.md
      - docs/plans/admin-users-list.md

  - id: first-release-prd
    name: First-release PRD review
    state: in-progress
    summary: PRD and confirmed product decisions are drafted; several booking rules are still proposals.
    next: Decide minimum booking notice, pending-slot holds, trainer verification and cancellation rules (PRD section 10).
    links:
      - docs/prd/scheduled-in-person-sessions.md
      - docs/decisions/first-release.md

  - id: feature-breakdown
    name: Feature breakdown
    state: planned
    summary: Split the agreed journey into features with acceptance criteria and contract entries.
    next: Starts after PRD review.
    links:
      - docs/prd/scheduled-in-person-sessions.md

  - id: trainer-home
    name: Trainer home screen
    state: in-progress
    summary: The approved trainer's home (pending booking requests and today's and tomorrow's sessions) and the read-only /setup page are implemented on feat/trainer-home, from the contract to the e2e tests.
    next: Open the pull request, confirm the 960 px desktop column width with the design owner, and run the manual browser check.
    links:
      - docs/designs/trainer-home.md

  - id: first-booking-journey
    name: First booking journey
    state: planned
    summary: One approved trainer publishes availability and one client requests a scheduled in-person booking that the trainer approves within 24 hours; no platform payments.
    next: Plan it once the feature breakdown exists.
    links:
      - docs/prd/scheduled-in-person-sessions.md

  - id: cognito-login
    name: Cognito hosted login
    state: planned
    summary: Replace development auth with hosted login (OIDC) and JWT verification before a real-user launch.
    next: Plan alongside the first booking journey.
    links:
      - Architecture.md#6-key-design-areas

  - id: phase-1-follow-ups
    name: Phase 1 follow-ups
    state: planned
    summary: Bundle budgets, contract-versus-Nest check, axe-core, shared commit guard and Prettier consistency.
    links:
      - Architecture.md#12-known-follow-ups-from-phase-1

  - id: deferred-capabilities
    name: On-demand dispatch, online sessions and platform payments
    state: deferred
    summary: Kept in the long-term vision and out of first-release scope until separately prioritized.
    links:
      - docs/decisions/first-release.md
